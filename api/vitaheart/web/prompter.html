<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vita Heart · prompter</title>
<script src="/prompter/script.js"></script>
<style>
  :root{color-scheme:dark;--warm:#F5B14C;--calm:#79C98B;--heart:#FF6F61;--sky:#7FC1FF;--dim:#7C838E}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#04060A;color:#F6F2EA;font:400 20px/1.4 -apple-system,system-ui,sans-serif;overflow:hidden}
  #top{position:fixed;inset:0 0 auto 0;height:82px;display:flex;align-items:center;gap:18px;padding:0 30px;
       border-bottom:1px solid rgba(255,255,255,.08);background:rgba(4,6,10,.94);z-index:6}
  #mode{font-weight:900;letter-spacing:4px;font-size:26px;padding:9px 20px;border-radius:12px}
  #scene{font-weight:800;letter-spacing:3px;font-size:20px;border:2px solid rgba(255,255,255,.3);border-radius:12px;padding:7px 16px}
  #clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:38px;letter-spacing:-1px;margin-left:auto}
  #left{font-size:16px;color:var(--dim);min-width:96px;text-align:right}
  #bar{position:fixed;top:82px;left:0;right:0;height:5px;background:rgba(255,255,255,.07);z-index:6}
  #bar i{display:block;height:100%;width:0;background:var(--warm);transition:width .3s linear}
  main{position:absolute;inset:87px 0 74px 0;display:flex;align-items:center;justify-content:center;padding:0 5vw}
  #stage{width:100%;max-width:1600px;text-align:center}
  .say{font-size:clamp(38px,4.6vw,86px);line-height:1.24;font-weight:600;letter-spacing:-.6px}
  .doList{display:flex;flex-direction:column;gap:22px;align-items:center}
  .doList b{font-size:clamp(34px,4vw,72px);font-weight:800;line-height:1.2}
  .hint{margin-top:34px;font-size:26px;color:var(--dim)}
  .rec{margin-top:26px;font-size:23px;color:#C0A268;background:rgba(245,177,76,.08);border:1px solid rgba(245,177,76,.22);
       border-radius:14px;padding:14px 20px;display:inline-block;max-width:1100px}
  #next{position:fixed;left:0;right:0;bottom:0;height:74px;display:flex;align-items:center;gap:16px;padding:0 30px;
        border-top:1px solid rgba(255,255,255,.08);background:rgba(4,6,10,.94);font-size:19px;color:var(--dim);z-index:6}
  #next b{color:#B7BDC6;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #next .btn{margin-left:auto;display:flex;gap:8px}
  #next button{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:10px;padding:9px 14px;background:#161C24;color:#C7CDD6}
  #next button.on{background:var(--warm);color:#20160A}
  #ring{width:118px;height:118px;margin:0 auto 26px;position:relative}
  #ring svg{transform:rotate(-90deg)}
  #ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}
  #big{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;
       background:#04060A;z-index:9;text-align:center;padding:0 6vw}
  #big .n{font-size:30vh;font-weight:900;line-height:1}
  #big .t{font-size:34px;color:var(--dim)}
  #heard{position:fixed;bottom:74px;left:0;right:0;padding:6px 30px;font-size:14px;color:#3E454F;white-space:nowrap;overflow:hidden;z-index:5}
  body.mirror main{transform:scaleX(-1)}
</style>

<div id="top">
  <span id="mode">READY</span>
  <span id="scene">TV</span>
  <span id="clock">0:00</span>
  <span id="left">of 2:45</span>
</div>
<div id="bar"><i></i></div>

<main><div id="stage"></div></main>
<div id="heard"></div>

<div id="next">
  <b id="nextText">Press Start, or the space bar, when OBS is recording.</b>
  <span class="btn">
    <button id="watch">Watch: not here</button>
    <button id="voice">voice off</button>
    <button id="mirror">mirror</button>
    <button id="startBtn" class="on">Start</button>
  </span>
</div>

<div id="big"><div class="n" id="bigN">3</div><div class="t" id="bigT">get ready</div></div>

<script>
const S = window.VITA_SCRIPT, B = S.blocks, $ = id => document.getElementById(id);
const API = location.origin, HH = new URLSearchParams(location.search).get('household') || 'AHMET1';
const ACT = S.actSeconds || 1.8;
const mmss = t => Math.floor(t/60) + ':' + String(Math.floor(Math.max(0,t))%60).padStart(2,'0');
const words = s => s.split(/\s+/).length;
const speakSeconds = b => words(b.say)/150*60;

/* Each block plays as up to three phases. The prompter is a small state machine over
   the flattened list, so at any instant there is exactly one instruction on screen:
   press this, say this, or say nothing. */
const PHASES = [];
B.forEach((b, i) => {
  if (b.do.length && b.actFirst) PHASES.push({k:'do', b, i, secs: ACT});
  PHASES.push({k:'say', b, i, secs: speakSeconds(b)});
  if (b.do.length && !b.actFirst) PHASES.push({k:'do', b, i, secs: ACT});
  if (b.hold) PHASES.push({k:'hold', b, i, secs: b.hold});
});
PHASES.push({k:'end', b: B[B.length-1], i: B.length-1, secs: 2});

let p = 0, running = false, t0 = 0, elapsed = 0, phaseStart = 0, micOn = false, rec = null;
let watchReady = localStorage.getItem('watchReady') === '1';

const MODE = {
  do:   {label:'PRESS',  bg:'rgba(127,193,255,.18)', fg:'#7FC1FF'},
  say:  {label:'SPEAK',  bg:'rgba(121,201,139,.2)',  fg:'#79C98B'},
  hold: {label:'SILENT', bg:'rgba(245,177,76,.2)',   fg:'#F5B14C'},
  end:  {label:'STOP',   bg:'rgba(255,111,97,.2)',   fg:'#FF6F61'},
};

function ring(remain, total){
  const r = 52, c = 2 * Math.PI * r, o = c * (1 - Math.max(0, remain) / total);
  return `<div id="ring"><svg width="118" height="118">
      <circle cx="59" cy="59" r="${r}" stroke="rgba(255,255,255,.12)" stroke-width="9" fill="none"/>
      <circle cx="59" cy="59" r="${r}" stroke="currentColor" stroke-width="9" fill="none"
              stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${o}"/>
    </svg><span>${Math.ceil(Math.max(0, remain))}</span></div>`;
}

function draw(){
  const ph = PHASES[p], m = MODE[ph.k];
  $('mode').textContent = m.label; $('mode').style.background = m.bg; $('mode').style.color = m.fg;
  $('scene').textContent = ph.b.scene;
  const remain = ph.secs - (elapsed - phaseStart);
  const st = $('stage');
  st.style.color = m.fg;
  if (ph.k === 'say') {
    const line = (!watchReady && ph.b.sayRecorded) ? ph.b.sayRecorded : ph.b.say;
    st.innerHTML = `<div class="say" style="color:#fff">${line}</div>` +
      (ph.b.recover ? `<div class="rec">If it misbehaves: ${ph.b.recover}</div>` : '') +
      `<div class="hint">${micOn ? 'it moves on when you finish the sentence' : 'space, or the arrow, when you finish'}</div>`;
  } else if (ph.k === 'do') {
    st.innerHTML = ring(remain, ph.secs) +
      `<div class="doList">${ph.b.do.map(d => `<b>${d}</b>`).join('')}</div>` +
      `<div class="hint">no words while you do this</div>`;
  } else if (ph.k === 'hold') {
    st.innerHTML = ring(remain, ph.secs) +
      `<div class="doList"><b>Say nothing. Let it happen.</b></div>` +
      `<div class="hint">${ph.b.scene === 'ALEXA' ? 'Alexa is answering' : ph.b.scene === 'WRIST' ? 'hold the wrist still' : 'the screen is catching up'}</div>`;
  } else {
    st.innerHTML = `<div class="doList"><b>Two seconds of silence, then stop the recording.</b></div>
      <div class="hint">${mmss(elapsed)} · target 2:45</div>`;
  }
  const nx = PHASES[p+1];
  $('nextText').textContent = nx ? (nx.k === 'say' ? 'Next, you say: ' + nx.b.say.slice(0, 96) + (nx.b.say.length > 96 ? '…' : '')
    : nx.k === 'do' ? 'Next, you press: ' + nx.b.do.join(' · ')
    : nx.k === 'hold' ? 'Next: silence for ' + nx.secs + ' seconds' : 'Next: stop the recording')
    : 'Last one.';
  $('bar').firstElementChild.style.width = Math.min(100, (elapsed / S.target) * 100) + '%';
  const over = elapsed - S.target;
  $('left').textContent = over > 0 ? '+' + mmss(over) + ' over' : 'of ' + mmss(S.target);
  $('left').style.color = over > 0 ? '#FF6F61' : '';
}

function advance(){
  if (p >= PHASES.length - 1) { return; }
  p++; phaseStart = elapsed;
  const ph = PHASES[p];
  // the television performs the step itself: no click reaches the simulator from a script,
  // and a take must not depend on a hand finding a key while a sentence is being read
  camera(ph.b.scene);
  if (ph.k === 'do' && ph.b.drive) { drive(ph.b.drive, ph.b.scene); }
  if (ph.k === 'end') { drive('endrecord'); }
  draw(); state();
}

function drive(step, scene){
  const source = watchReady ? 'watch' : 'recorded';
  fetch(`${API}/demo`, {method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({household: HH, step, source, scene: scene ?? null})}).catch(()=>{});
}

// The camera follows the script. obs_director.py hears this on the events channel and
// switches the scene itself, because a function key pressed mid-sentence is the thing
// that goes wrong in a take, and it goes wrong quietly.
let shown = null;
function camera(scene){
  if (!scene || scene === shown) return;
  shown = scene;
  drive('scene', scene);
}

function loop(){
  // setInterval, not requestAnimationFrame: a browser stops animation frames the moment the
  // window is behind another one, and the take must keep its own time regardless.
  if (running) {
    elapsed = (performance.now() - t0) / 1000;
    $('clock').textContent = mmss(elapsed);
    const ph = PHASES[p], gone = elapsed - phaseStart;
    // timed phases run themselves; a spoken line waits for the voice, then for a grace period,
    // so a missed word never stalls the take.
    if (ph.k === 'do' || ph.k === 'hold') { if (gone >= ph.secs) advance(); else draw(); }
    else if (ph.k === 'say') { if (gone >= ph.secs + 4.5) advance(); else draw(); }
  }
}

function begin(){
  const big = $('big'); let n = 3;
  big.style.display = 'flex'; $('bigN').textContent = n; $('bigT').textContent = 'the recording starts by itself';
  const id = setInterval(() => {
    n--;
    if (n === 0) { clearInterval(id); big.style.display = 'none'; running = true; t0 = performance.now(); elapsed = 0; phaseStart = 0; p = 0;
      shown = null; drive('record'); camera(PHASES[0].b.scene);
      if (micOn) listen(); draw(); state(); }
    else $('bigN').textContent = n;
  }, 1000);
}
function pause(){ running = false; $('mode').textContent = 'PAUSED'; state(); }
function reset(){ running = false; elapsed = 0; p = 0; phaseStart = 0; $('clock').textContent = '0:00'; draw(); state(); }

/* ---- voice: move when the sentence ends, not when a clock says so ---- */
const norm = s => s.toLowerCase().replace(/[^a-z0-9çğıöşü ]/g, ' ').replace(/\s+/g, ' ').trim();
function listen(){
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R || rec || !micOn) return;
  rec = new R(); rec.continuous = true; rec.interimResults = true; rec.lang = 'en-US';
  rec.onresult = e => {
    let heard = '';
    for (let k = e.resultIndex; k < e.results.length; k++) heard += e.results[k][0].transcript + ' ';
    heard = norm(heard); if (!heard) return;
    $('heard').textContent = '… ' + heard.slice(-120);
    const ph = PHASES[p];
    if (ph.k !== 'say') return;
    const cue = norm(ph.b.cue).split(' ');
    const tail = heard.split(' ').slice(-14);
    if (cue.filter(w => tail.includes(w)).length / cue.length >= 0.7) advance();
  };
  rec.onend = () => { rec = null; if (micOn) listen(); };
  try { rec.start(); } catch (_) {}
}

/* ---- optional phone remote, over the household's own events channel ---- */
let cursor, lastState = 0;
function state(){
  const now = Date.now(); if (now - lastState < 400) return; lastState = now;
  fetch(`${API}/prompter`, {method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({household: HH, cmd: 'state', index: PHASES[p].i, elapsed: Math.round(elapsed), running})}).catch(()=>{});
}
(async function poll(){
  for(;;){
    try{
      const r = await fetch(`${API}/events?household=${HH}&since=${cursor ?? ''}&wait=20`);
      const j = await r.json(); cursor = j.cursor;
      for (const e of j.events){
        if (e.kind !== 'prompter') continue;
        const c = (e.data || {}).cmd;
        if (c === 'play' && !running) begin();
        else if (c === 'pause') pause();
        else if (c === 'reset') reset();
        else if (c === 'next') advance();
        else if (c === 'prev' && p > 0) { p--; phaseStart = elapsed; draw(); }
      }
    }catch(_){ await new Promise(r => setTimeout(r, 2000)); }
  }
})();

$('startBtn').onclick = () => running ? pause() : begin();
$('voice').onclick = () => {
  micOn = !micOn;
  $('voice').textContent = micOn ? 'voice on' : 'voice off';
  $('voice').classList.toggle('on', micOn);
  if (micOn) listen(); else if (rec) { rec.stop(); rec = null; }
  draw();
};
$('mirror').onclick = () => document.body.classList.toggle('mirror');
$('watch').onclick = () => {
  watchReady = !watchReady;
  localStorage.setItem('watchReady', watchReady ? '1' : '0');
  $('watch').textContent = watchReady ? 'Watch: on the wrist' : 'Watch: not here';
  $('watch').classList.toggle('on', watchReady);
  draw();
};
$('watch').textContent = watchReady ? 'Watch: on the wrist' : 'Watch: not here';
$('watch').classList.toggle('on', watchReady);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); running ? advance() : begin(); }
  if (e.code === 'ArrowRight') { e.preventDefault(); advance(); }
  if (e.code === 'ArrowLeft' && p > 0) { e.preventDefault(); p--; phaseStart = elapsed; draw(); }
  if (e.key === 'r') reset();
});
draw(); setInterval(loop, 120);
</script>

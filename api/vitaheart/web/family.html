<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vita Heart · Family</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 18px/1.45 -apple-system, system-ui, sans-serif; background: #f6f2ea; color: #1a1f26; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 20px 60px; }
  h1 { font-size: 28px; margin: 0 0 4px; } .muted { color: #6b7380; font-size: 15px; }
  section { background: #fff; border-radius: 18px; padding: 18px; margin-top: 18px; box-shadow: 0 1px 0 #e5dfd3; }
  section h2 { font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; color: #7a4d00; margin: 0 0 10px; }
  .summary { font-size: 20px; line-height: 1.5; }
  .msg { padding: 10px 0; border-top: 1px solid #eee7da; } .msg b { display: block; font-size: 14px; color: #6b7380; }
  form { display: flex; gap: 8px; margin-top: 12px; }
  input[type=text] { flex: 1; font: inherit; padding: 12px 14px; border: 1px solid #d8d1c4; border-radius: 12px; }
  button { font: inherit; font-weight: 700; padding: 12px 18px; border: 0; border-radius: 12px; background: #f2a93b; color: #0f1216; }
  ol.trace { list-style: none; padding: 0; margin: 0; } ol.trace li { padding: 8px 0; border-top: 1px solid #eee7da; font-size: 15px; }
  ol.trace b { color: #7a4d00; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; display: block; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #7fb77e; margin-right: 6px; }
  a { color: #7a4d00; }
</style>
<main>
  <h1 id="title">Vita Heart</h1>
  <div class="muted" id="sub"></div>
  <section><h2>Tonight's summary</h2><div class="summary" id="summary">No summary yet today. Night Watch writes one at 21:00.</div><div class="muted" id="signals"></div></section>
  <section><h2>Today on the television</h2><div id="today"></div></section>
  <section><h2>Messages</h2><div id="messages"></div>
    <form id="reply"><input type="text" id="text" maxlength="280" placeholder="Write one line; it appears on the TV" required><button type="submit">Send</button></form></section>
  <section><h2>What the agents did</h2><ol class="trace" id="trace"></ol></section>
  <p class="muted">Add boxes from this phone: <a id="cabinet" href="#">photograph the medicines</a>.</p>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const household = (params.get('household') || 'AHMET1').toUpperCase();
  const author = params.get('as') || 'Selin';
  const api = location.origin; const $ = id => document.getElementById(id);
  $('cabinet').href = api + '/cabinet?household=' + household;
  async function load() {
    const b = await (await fetch(api + '/board?household=' + household)).json();
    $('title').textContent = 'Vita Heart · ' + b.person.name; $('sub').textContent = 'Household ' + household + ' · you are ' + author;
    const due = b.dueDoses || [];
    $('today').innerHTML = `<div><span class="dot" style="background:${b.checkedInToday ? '#7fb77e' : '#b8b3a8'}"></span>${b.checkedInToday ? 'Said "I\\'m up" this morning.' : 'Has not pressed "I\\'m up" yet.'}</div>` +
      (due.length ? `<div style="margin-top:6px">${due.filter(d => d.confirmed).length} of ${due.length} doses confirmed${due.some(d => d.unscheduled) ? ' · times not set yet' : ''}.</div>` : '<div style="margin-top:6px">No medicines added yet.</div>');
    const s = await (await fetch(api + '/family/summary?household=' + household)).json();
    if (s.summary) { $('summary').textContent = s.summary.text; $('signals').textContent = (s.summary.signals || []).map(x => x.note).join(' '); }
    const m = await (await fetch(api + '/family/messages?household=' + household)).json();
    $('messages').innerHTML = m.messages.map(x => `<div class="msg"><b>${x.author} · ${new Date(x.ts).toLocaleString()}</b>${x.text}</div>`).join('') || '<div class="muted">No messages yet.</div>';
    const t = await (await fetch(api + '/trace?household=' + household)).json();
    $('trace').innerHTML = t.steps.slice(0, 30).map(st => `<li><b>${st.agent} · ${st.tool}</b>${st.said || ''}</li>`).join('') || '<li class="muted">Nothing yet.</li>';
  }
  $('reply').addEventListener('submit', async ev => {
    ev.preventDefault();
    await fetch(api + '/family/messages', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({household, author, text: $('text').value})});
    $('text').value = ''; load();
  });
  load(); setInterval(load, 15000);
</script>

<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vita Heart · Add the boxes</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 18px/1.45 -apple-system, system-ui, sans-serif; background: #f6f2ea; color: #1a1f26; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 20px 60px; }
  h1 { font-size: 28px; margin: 0 0 6px; }
  p.lead { margin: 0 0 24px; color: #4a5260; }
  label.big { display: block; background: #f2a93b; color: #0f1216; font-weight: 700; font-size: 22px;
              text-align: center; padding: 22px; border-radius: 18px; cursor: pointer; }
  input[type=file] { display: none; }
  .code { font-variant-numeric: tabular-nums; letter-spacing: 2px; font-weight: 700; }
  ol.trace { list-style: none; padding: 0; margin: 24px 0 0; }
  ol.trace li { background: #fff; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 1px 0 #e5dfd3; }
  ol.trace b { color: #7a4d00; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; display: block; }
  .med { background: #fff; border-radius: 18px; padding: 18px; margin-top: 18px; border-left: 8px solid #7fb77e; }
  .med.unconfirmed { border-left-color: #e4b363; } .med.unreadable { border-left-color: #b8b3a8; }
  .med h2 { margin: 0 0 4px; font-size: 22px; } .muted { color: #6b7380; font-size: 15px; }
  .status { font-size: 15px; color: #4a5260; margin-top: 12px; min-height: 1.4em; }
  img.preview { width: 100%; border-radius: 14px; margin-top: 16px; }
</style>
<main>
  <h1>Add the boxes</h1>
  <p class="lead">Household <span class="code" id="hh"></span>. Photograph one or more medicine boxes, label side up. The reading takes about ten seconds and appears on the television.</p>
  <label class="big" for="photo">Take a photo</label>
  <input id="photo" type="file" accept="image/*" capture="environment">
  <div class="status" id="status"></div>
  <img class="preview" id="preview" hidden alt="">
  <div id="meds"></div>
  <ol class="trace" id="trace"></ol>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const household = (params.get('household') || 'AHMET1').toUpperCase();
  document.getElementById('hh').textContent = household;
  const api = location.origin;
  const $ = id => document.getElementById(id);
  const say = t => { $('status').textContent = t; };

  $('photo').addEventListener('change', async ev => {
    const file = ev.target.files[0];
    if (!file) return;
    const type = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
    $('preview').src = URL.createObjectURL(file); $('preview').hidden = false;
    $('meds').innerHTML = ''; $('trace').innerHTML = '';
    try {
      say('Asking for a place to put the photo…');
      const up = await (await fetch(api + '/meds/upload-url', {method: 'POST', headers: {'content-type': 'application/json'},
        body: JSON.stringify({household, content_type: type})})).json();
      say('Uploading…');
      const put = await fetch(up.url, {method: 'PUT', headers: {'content-type': type}, body: file});
      if (!put.ok) throw new Error('upload failed: ' + put.status);
      say('Reading the label… the Reader, the Identifier and the Watchman are working.');
      const res = await fetch(api + '/meds/read', {method: 'POST', headers: {'content-type': 'application/json'},
        body: JSON.stringify({household, key: up.key})});
      if (!res.ok) throw new Error('reading failed: ' + res.status);
      const out = await res.json();
      say(out.meds.length ? 'Done. It is on the television now.' : 'No medicine box was visible in that photo. Try again with the label facing the camera.');
      for (const m of out.meds) {
        const el = document.createElement('div');
        el.className = 'med ' + (m.status || '');
        const slots = (m.directions && m.directions.slots || []).join(', ');
        el.innerHTML = `<h2>${m.name || 'Unreadable box'} ${m.strength ? '· ' + m.strength : ''}</h2>
          <div class="muted">${m.status === 'identified' ? 'Confirmed: ' + (m.identity && m.identity.name) : m.status === 'unconfirmed' ? 'Read, but not confirmed against RxNorm. Kept as printed.' : 'Could not be read. Nothing was guessed.'}</div>
          <div class="muted">${m.directions && m.directions.understood ? 'Slots: ' + slots + (m.directions.food ? ' · ' + m.directions.food : '') : 'Directions not understood; the television will ask.'}</div>
          ${m.recalls && m.recalls.length ? `<div class="muted">${m.recalls.length} live recall record(s) found for the ingredient. The television shows the question to ask the pharmacist.</div>` : ''}`;
        $('meds').appendChild(el);
      }
      for (const s of out.trace) {
        const li = document.createElement('li');
        li.innerHTML = `<b>${s.agent} · ${s.tool}</b>${s.said}`;
        $('trace').appendChild(li);
      }
    } catch (e) { say('Something went wrong: ' + e.message); }
  });
</script>
